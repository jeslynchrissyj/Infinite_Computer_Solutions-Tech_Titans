name: .NET Core CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore "frame work/RagApi/RagApi.csproj"

    - name: Build Project
      run: dotnet build "frame work/RagApi/RagApi.csproj" --no-restore -c Release

    - name: Run Unit Tests
      run: dotnet test "frame work/RagApi.Tests/RagApi.Tests.csproj" -c Release
